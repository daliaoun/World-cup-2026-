[project]
name = "wc2026-predictor"
version = "1.0.0"
description = "A probabilistic forecasting engine for the 2026 FIFA World Cup knockout stage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ali Aoun" }]
keywords = ["football", "soccer", "forecasting", "dixon-coles", "poisson", "world-cup"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
